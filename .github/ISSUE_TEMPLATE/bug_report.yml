name: Bug report
description: Report incorrect or unexpected behaviour in an estimator or utility.
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: soft-clustering version
      description: "Output of: python -c \"import soft_clustering; print(soft_clustering.__version__)\""
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Python version and operating system
      placeholder: "Python 3.12.3, Ubuntu 24.04"
    validations:
      required: true

  - type: textarea
    id: reproducer
    attributes:
      label: Minimal reproducible example
      description: Self-contained code that reproduces the problem, including how X is generated.
      render: python
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Paste the full traceback or the incorrect output.
    validations:
      required: true
