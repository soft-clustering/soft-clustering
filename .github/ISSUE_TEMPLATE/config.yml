# Every issue should arrive through one of the structured forms, so that
# reports carry a version, an environment and a reproducer from the outset.
blank_issues_enabled: false

contact_links:
  - name: 📚 Documentation
    url: https://soft-clustering.readthedocs.io/en/latest/index.html
    about: API reference, algorithm descriptions, benchmarking guide and usage examples.

  - name: 🔒 Report a security vulnerability
    url: https://github.com/soft-clustering/soft-clustering/security/advisories/new
    about: Report privately instead of opening a public issue. See SECURITY.md.

# GitHub Discussions is not enabled for this repository, and a contact_link
# pointing at a disabled feature renders as a dead link. Usage questions are
# served by the "Question" issue form instead. If Discussions is enabled later
# (Settings -> General -> Features), restore the entry below and delete
# question.yml.
