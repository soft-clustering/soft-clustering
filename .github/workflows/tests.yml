name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly run against fresh dependency resolutions, to catch upstream breakage.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Least privilege by default; no job here writes to the repository.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The full cross-product, so that "three operating systems and four
        # Python versions" describes what actually runs. The suite takes about
        # 70 s, so twelve jobs stay well inside the timeout.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU-only PyTorch (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package with test and deep-learning extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,deep]"

      - name: Report resolved dependency versions
        run: pip list

      - name: Run test suite with coverage
        run: >-
          pytest
          --cov=soft_clustering
          --cov-report=xml
          --cov-report=term-missing
          --durations=10

      - name: Verify the reported claim counts still match the source
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        # Every quantitative claim in the paper and README comes from these
        # scripts. Running them in CI is what stops the numbers drifting, as
        # the test count, the coverage figure and the "18 algorithms under
        # 10 ms" claim all previously did.
        run: |
          python tools/paper_stats.py --json
          python tools/check_paper_numbers.py --full

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  packaging:
    # Catch distribution defects on every pull request rather than at release
    # time, when they are expensive to fix.
    name: build and inspect distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Validate distribution metadata
        run: twine check --strict dist/*

      - name: Every package directory must be present in both artifacts
        # flit ships exactly one top-level package, so a subpackage that is not
        # imported from soft_clustering/__init__.py can silently go missing.
        run: |
          python - <<'PY'
          import pathlib, tarfile, zipfile

          expected = {"soft_clustering", "soft_clustering/benchmarking",
                      "soft_clustering/benchmarking/benchmark"}
          # A non-.py file is the easiest thing to lose from a distribution,
          # and without it every type hint in the package is ignored (PEP 561).
          expected_files = {"soft_clustering/py.typed"}

          wheel = next(pathlib.Path("dist").glob("*.whl"))
          names = zipfile.ZipFile(wheel).namelist()
          missing = {p for p in expected
                     if not any(n.startswith(p + "/") for n in names)}
          missing |= {f for f in expected_files if f not in names}
          assert not missing, f"missing from wheel {wheel.name}: {sorted(missing)}"
          print(f"{wheel.name}: {len(names)} entries, all packages present")

          sdist = next(pathlib.Path("dist").glob("*.tar.gz"))
          with tarfile.open(sdist) as tar:
              names = tar.getnames()
          missing = {p for p in expected
                     if not any(f"/{p}/" in n for n in names)}
          missing |= {f for f in expected_files
                      if not any(n.endswith("/" + f) for n in names)}
          assert not missing, f"missing from sdist {sdist.name}: {sorted(missing)}"
          print(f"{sdist.name}: {len(names)} entries, all packages present")
          PY

      - name: Distributions must carry no editor, OS or bytecode cruft
        # JMLR's MLOSS submission checklist requires a source package free of
        # version-control and platform metadata, and warns that some of it is
        # invisible on the author's own machine. It was: flit does not consult
        # .gitignore for files inside the package directory, so a macOS
        # `.DS_Store` shipped in both artifacts. Enforced here rather than
        # remembered.
        run: |
          python - <<'PY'
          import fnmatch, pathlib, tarfile, zipfile

          FORBIDDEN = [
              "*/.DS_Store", ".DS_Store", "*/._*", "._*", "*/Thumbs.db",
              "*.pyc", "*.pyo", "*/__pycache__/*", "*/.git/*", "*/.gitignore",
              "*/.pytest_cache/*", "*/.ruff_cache/*", "*/.ipynb_checkpoints/*",
              "*.orig", "*.rej", "*~", "*.swp",
          ]

          def offenders(names):
              return sorted({n for n in names
                             for p in FORBIDDEN if fnmatch.fnmatch(n, p)})

          wheel = next(pathlib.Path("dist").glob("*.whl"))
          bad = offenders(zipfile.ZipFile(wheel).namelist())
          assert not bad, f"cruft in wheel {wheel.name}: {bad}"

          sdist = next(pathlib.Path("dist").glob("*.tar.gz"))
          with tarfile.open(sdist) as tar:
              names = tar.getnames()
          bad = offenders(names)
          assert not bad, f"cruft in sdist {sdist.name}: {bad}"
          print("both artifacts are clean")

          # The sdist must be self-sufficient: a reviewer who receives only the
          # source package has to be able to run the suite and reproduce the
          # published results.
          required = ["tests/", "example/", "benchmarks/", "optimization/",
                      "tools/", "LICENSE", "README.md", "CHANGELOG.md"]
          missing = [r for r in required
                     if not any(f"/{r}" in n or n.endswith(f"/{r}")
                                for n in names)]
          assert not missing, f"missing from sdist: {missing}"
          print(f"sdist ships {len(names)} entries including tests and benchmarks")
          PY

      - name: Every source file must carry its licence
        # "Ensure the licensing terms ... are clearly stated in the source
        # package and mentioned in each source file" -- JMLR MLOSS checklist.
        run: |
          python - <<'PY'
          import pathlib, subprocess

          tracked = subprocess.run(
              ["git", "ls-files", "*.py"],
              capture_output=True, text=True, check=True,
          ).stdout.split()
          missing = [f for f in tracked
                     if "SPDX-License-Identifier" not in
                     pathlib.Path(f).read_text(encoding="utf-8")]
          assert not missing, (
              f"{len(missing)} source file(s) without an SPDX header: "
              f"{missing[:10]}"
          )
          print(f"all {len(tracked)} tracked Python files carry an SPDX header")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  minimal-install:
    # The published wheel must be installable and importable without the
    # optional deep-learning stack. This job is the regression test for that.
    name: minimal install (no extras)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install core package only
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Every non-deep estimator must import and construct
        # Importing the top-level package proves nothing: estimators are
        # imported lazily (PEP 562), so `import soft_clustering` touches none
        # of them. This job existed in that form while six estimators were
        # unimportable without scikit-learn. Walk the registry instead.
        run: |
          cd "$(mktemp -d)"
          python - <<'PY'
          import soft_clustering as sc

          print(sc.__version__, len(sc.__all__), "exports")
          broken, deep = [], []
          for name in sorted(sc._ESTIMATORS):
              try:
                  getattr(sc, name)
              except ImportError as exc:
                  (deep if name in sc.DEEP_ESTIMATORS else broken).append(
                      (name, str(exc))
                  )
          assert not broken, f"unimportable on a base install: {broken}"
          assert sorted(n for n, _ in deep) == sorted(sc.DEEP_ESTIMATORS), (
              "the deep extra guard did not fire for exactly the deep "
              f"estimators: {sorted(n for n, _ in deep)}"
          )
          print(f"{len(sc._ESTIMATORS) - len(deep)} estimators importable, "
                f"{len(deep)} correctly gated behind [deep]")
          PY

      - name: Fit a representative estimator from each input modality
        run: |
          cd "$(mktemp -d)"
          python - <<'PY'
          import numpy as np
          from soft_clustering import FCM, BayesianNMF, KMART, SCSPA

          rng = np.random.default_rng(0)
          X = np.vstack([rng.normal(-3, .3, (30, 4)), rng.normal(3, .3, (30, 4))])
          assert FCM(n_clusters=2, random_state=0).fit(X).memberships_.shape == (60, 2)

          A = (rng.random((30, 30)) < .3).astype(float)
          A = np.maximum(A, A.T); np.fill_diagonal(A, 0)
          assert BayesianNMF(n_clusters=3).fit(A).memberships_.shape[0] == 30

          docs = ["fuzzy clustering membership", "graph community detection",
                  "topic model document words", "gaussian mixture model"]
          assert KMART().fit(docs).memberships_.shape[0] == 4

          parts = []
          for _ in range(3):
              M = np.abs(rng.normal(size=(30, 3)))
              parts.append(M / M.sum(axis=1, keepdims=True))
          assert SCSPA(n_clusters=3).fit(parts).memberships_.shape[0] == 30
          print("feature, graph, document and ensemble modalities all fit")
          PY
      - name: The benchmarking suite must ship inside the wheel
        # Regression test for the packaging defect where benchmarking lived
        # outside the distributed package and so was unavailable to users who
        # installed from PyPI rather than cloning the repository.
        run: |
          cd "$(mktemp -d)"
          python - <<'PY'
          import soft_clustering.benchmarking as b
          print("benchmarking exports:", len(b.__all__))
          assert "ClusteringBenchmark" in b.__all__
          assert "BenchmarkAdapter" in b.__all__
          # Importable with no benchmarking extras installed; the dependency
          # error must surface only when a feature that needs one is used.
          try:
              b.ClusteringBenchmark(models=[], benchmarks=[]).run(None)
          except ImportError as exc:
              assert "soft-clustering[bench]" in str(exc), exc
              print("optional-dependency guard OK:", exc)
          else:
              raise SystemExit("expected an ImportError without the bench extra")
          PY

  bench-extra:
    # The benchmarking suite must actually run once its extra is installed.
    name: benchmarking extra
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the package with the bench extra
        run: |
          python -m pip install --upgrade pip
          pip install ".[bench]" pytest
      - name: Run the benchmarking tests against the installed package
        run: |
          workdir="$(mktemp -d)"
          cp -r tests "$workdir/tests"
          cd "$workdir"          # away from the repo, so the wheel is what gets imported
          pytest tests/test_benchmarking.py -q

  examples:
    name: run examples
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package with all extras
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,deep]"
      - name: Execute every example script
        env:
          MPLBACKEND: Agg  # runners are headless
        run: |
          status=0
          for f in example/*.py; do
            echo "::group::$f"
            python "$f" || { echo "::error file=$f::example failed"; status=1; }
            echo "::endgroup::"
          done
          exit $status
