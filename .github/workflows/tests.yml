name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly run against fresh dependency resolutions, to catch upstream breakage.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # Cross-platform coverage on a single interpreter, to keep CI time bounded.
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU-only PyTorch (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package with test and deep-learning extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,deep]"

      - name: Report resolved dependency versions
        run: pip list

      - name: Run test suite with coverage
        run: >-
          pytest
          --cov=soft_clustering
          --cov-report=xml
          --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  minimal-install:
    # The published wheel must be installable and importable without the
    # optional deep-learning stack. This job is the regression test for that.
    name: minimal install (no deep extra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install core package only
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Import the package from a clean working directory
        run: |
          cd "$(mktemp -d)"
          python -c "import soft_clustering as sc; print(sc.__version__, len(sc.__all__))"

  examples:
    name: run examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package with all extras
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,deep]"
      - name: Execute every example script
        env:
          MPLBACKEND: Agg  # runners are headless
        run: |
          status=0
          for f in example/*.py; do
            echo "::group::$f"
            python "$f" || { echo "::error file=$f::example failed"; status=1; }
            echo "::endgroup::"
          done
          exit $status
