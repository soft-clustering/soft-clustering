name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install linters
        run: pip install ruff black

      - name: ruff (lint)
        run: ruff check soft_clustering benchmarking tests example

      - name: black (format check)
        run: black --check --diff soft_clustering benchmarking tests example
