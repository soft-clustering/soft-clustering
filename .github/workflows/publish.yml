name: publish

on:
  release:
    types: [published]
  workflow_dispatch:  # build and verify only; the publish job is gated on a release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Validate distribution metadata
        run: twine check --strict dist/*

      - name: Release tag must match the package version
        # A tag that disagrees with soft_clustering.__version__ produces a
        # release whose artifacts cannot be traced back to it. PyPI uploads are
        # immutable, so this has to be caught before the publish job runs.
        if: github.event_name == 'release'
        run: |
          pip install --no-deps dist/*.whl
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c 'import soft_clustering; print(soft_clustering.__version__)')"
          echo "release tag: $tag"
          echo "package version: $version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Release tag '$tag' does not match soft_clustering.__version__ '$version'"
            exit 1
          fi

      - name: Smoke-test the built wheel in a clean environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install dist/*.whl
          cd "$(mktemp -d)"   # so the repository checkout cannot satisfy the import
          /tmp/smoke/bin/python -c "import soft_clustering as sc; print('version', sc.__version__, 'estimators', len(sc.__all__))"
          /tmp/smoke/bin/python -c "import soft_clustering.benchmarking as b; print('benchmarking exports', len(b.__all__))"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    # Only a published release reaches PyPI. Manual dispatch still exercises the
    # build and its checks, but stops here.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/soft-clustering
    permissions:
      # Trusted publishing: no long-lived PyPI token is stored in the repository.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Signed provenance attestations, so consumers can verify that these
          # artifacts were built by this workflow from this repository.
          attestations: true
