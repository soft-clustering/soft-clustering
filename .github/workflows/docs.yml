name: docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          # Matches the interpreter in .readthedocs.yaml, so a build that
          # passes here is the build Read the Docs will run.
          python-version: "3.10"
          cache: pip

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
          pip install .

      - name: Build HTML documentation
        # -W turns warnings into errors, so broken references, malformed
        # directives and bad heading levels fail the build instead of
        # accumulating. --keep-going reports every problem in one run.
        run: sphinx-build -b html -W --keep-going docs/source docs/_build/html

      - name: Upload built documentation
        uses: actions/upload-artifact@v7
        with:
          name: html-docs
          path: docs/_build/html
          retention-days: 14

  linkcheck:
    # External links rot, but they also fail for reasons outside this
    # repository: transient outages, and hosts that refuse automated clients.
    # This job therefore reports rather than gates.
    #
    # continue-on-error is set on the step, not the job. At job level it spares
    # the workflow conclusion but still renders this check red, which trains
    # everyone to ignore a permanently failing check. At step level the job
    # concludes green and the findings are written to the run summary instead.
    name: link check (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
          pip install .

      - name: Check external links
        id: linkcheck
        continue-on-error: true
        run: sphinx-build -b linkcheck docs/source docs/_build/linkcheck

      - name: Report findings to the run summary
        if: always()
        run: |
          report=docs/_build/linkcheck/output.txt
          {
            echo "## Documentation link check"
            echo
            if [ "${{ steps.linkcheck.outcome }}" = "success" ]; then
              echo "All checked links resolved."
            else
              echo "The following links did not resolve. This is informational:"
              echo "the job does not block a merge, because external hosts fail"
              echo "for reasons unrelated to this repository."
              echo
              echo '```'
              if [ -s "$report" ]; then cat "$report"; else echo "(no report written; see the step log)"; fi
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
