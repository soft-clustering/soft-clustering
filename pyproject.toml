[build-system]
requires = ["flit_core >=3.12,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "soft-clustering"
authors = [
  {name = "Kiyan Rezaee", email = "kiyanrezaee17@gmail.com"},
  {name = "Morteza Ziabakhsh", email = "morteza24mail@protonmail.com"},
]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
license = "MIT"
license-files = ["LICENSE*"]
dynamic = ["version", "description"]
# Kept to what is needed to fit a model. Anything required only to benchmark,
# document or develop the package belongs in an extra below.
#
# scikit-learn is a hard dependency, not a benchmarking extra: eight estimators
# import it at module level for a supporting primitive (DBSCAN inside
# SoftDBSCANGM, KMeans inside the three consensus methods, CountVectorizer
# inside LDA and PLSI, rbf_kernel inside SKFCM and SoftKSC, kneighbors_graph
# inside AFCM). Listing it under `bench` made those estimators unimportable on
# a documented base install; the minimal-install CI job now instantiates every
# estimator so this cannot regress.
dependencies = [
  "numpy",
  "scipy",
  "scikit-learn",
  "typeguard",  # the @typechecked decorator applied by 41 estimators
]

[project.optional-dependencies]
deep = [
  "torch",
]
# Sphinx and its Markdown parser. Mirrored in docs/requirements.txt, which is
# what Read the Docs installs.
docs = [
  "sphinx",
  "sphinx-rtd-theme",
  "myst_parser>=3.0.1,<4",  # <4: evclust (dev, baselines) requires it
]
# Needed to *run* a benchmark, never to fit a model. soft_clustering.benchmarking
# imports these defensively, so the module is importable without them.
bench = [
  "pandas",        # result tables
  "psutil",        # resident-set sampling for the memory and scalability backends
  "tabulate",      # BenchmarkReport.to_markdown()
]
# Third-party implementations used only as references by
# tests/test_external_agreement.py and benchmarks/run_external_baselines.py.
# evclust is maintained by the author of the evidential clustering methods,
# which makes it the strongest reference available for ECM.
baselines = [
  "scikit-fuzzy",
  "evclust",
  "networkx",
]
dev = [
  "matplotlib",
  "pytest>=7.0",
  "pytest-cov>=4.0",
  # Kept in step with the bench extra above; listed explicitly rather than via a
  # self-referential extra, which does not resolve reliably for editable installs.
  "pandas",
  "psutil",
  "tabulate",
  "scikit-fuzzy",
  "evclust",
  "networkx",
]

[project.urls]
Homepage = "https://soft-clustering.readthedocs.io/en/latest/index.html"
Issues = "https://github.com/soft-clustering/soft-clustering/issues"

# What travels in the source distribution.
#
# flit ships only the importable package by default, which left the sdist with
# no tests, no examples and no benchmark or optimization artifacts -- so nobody
# who obtained SCPP as a source package could run the suite or reproduce a
# published number. `include` fixes that.
#
# `exclude` is the other half. flit copies everything under the package
# directory verbatim and does not consult .gitignore, so a macOS `.DS_Store`
# sitting next to __init__.py was being published inside both the sdist and the
# wheel. These patterns are enforced in CI by the `packaging` job.
[tool.flit.sdist]
include = [
  "tests/",
  "example/",
  "benchmarks/",
  "optimization/",
  "docs/",
  "tools/",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "CODE_OF_CONDUCT.md",
  "CITATION.cff",
  "THIRD_PARTY_NOTICES.md",
]
exclude = [
  "**/.DS_Store",
  "**/__pycache__/",
  "**/*.py[cod]",
  "**/.pytest_cache/",
  "**/.ruff_cache/",
  "**/.ipynb_checkpoints/",
  "**/Thumbs.db",
  "**/._*",
  # 4.4 MB promotional image; not part of the software.
  "SCPP_Poster.png",
  # Generated at documentation build time (docs/source/conf.py).
  "docs/source/algorithms/",
  "docs/_build/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["soft_clustering"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mypy]
files = ["soft_clustering"]
# NumPy's current stubs use 3.12 syntax; runtime support (3.10+) is tested by CI.
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# Estimators declare the inputs they actually take (``fit(X)``,
# ``fit(X, y)``, ``fit(X_view1, X_view2)``, ...), which narrows the base
# class's ``fit(X, y=None, *args, **kwargs)``. The wrapper installed by
# ``BaseSoftClusterer.__init_subclass__`` adapts every one of them to the
# common protocol at runtime, and tests/test_protocol.py checks that it does,
# so the static override check is disabled for the estimator modules only.
[[tool.mypy.overrides]]
module = [
  "soft_clustering._afcm",
  "soft_clustering._afcmSimple",
  "soft_clustering._afcmadaptive",
  "soft_clustering._bgmm",
  "soft_clustering._bigclam",
  "soft_clustering._bnmf",
  "soft_clustering._cafcm",
  "soft_clustering._cafhfcm",
  "soft_clustering._cdcgs",
  "soft_clustering._dmon",
  "soft_clustering._ecm",
  "soft_clustering._entropyfcm",
  "soft_clustering._evclus",
  "soft_clustering._fcc",
  "soft_clustering._fcm",
  "soft_clustering._femifuzzy",
  "soft_clustering._gathgeva",
  "soft_clustering._gk",
  "soft_clustering._gmm",
  "soft_clustering._kfccl",
  "soft_clustering._kfcm",
  "soft_clustering._kmart",
  "soft_clustering._lda",
  "soft_clustering._mbmm",
  "soft_clustering._mmsb",
  "soft_clustering._nocd",
  "soft_clustering._pcm",
  "soft_clustering._pfcm",
  "soft_clustering._plsi",
  "soft_clustering._rdfkc",
  "soft_clustering._rough_k_means",
  "soft_clustering._rpfkm",
  "soft_clustering._scm",
  "soft_clustering._scspa",
  "soft_clustering._sfcmep",
  "soft_clustering._shbgf",
  "soft_clustering._sisc",
  "soft_clustering._skfcm",
  "soft_clustering._smcla",
  "soft_clustering._softdbscangm",
  "soft_clustering._softksc",
  "soft_clustering._wbsc",
]
disable_error_code = ["override"]

[tool.black]
target-version = ["py310"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
# Pyflakes (F) catches real defects; pycodestyle (E, W) and isort (I) keep the
# tree consistent. Rules that would require reformatting third-party-derived
# algorithm code without improving it are left off.
select = ["E", "F", "W", "I", "UP"]
ignore = [
  "E501",  # line length is enforced by black
  "E741",  # single-letter names are idiomatic in the algorithm implementations
]

[tool.ruff.lint.per-file-ignores]
"soft_clustering/__init__.py" = ["F401"]
"example/*.py" = ["E402"]  # examples adjust sys.path before importing
