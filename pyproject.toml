[build-system]
requires = ["flit_core >=3.12,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "soft-clustering"
authors = [
  {name = "Kiyan Rezaee", email = "kiyanrezaee17@gmail.com"},
  {name = "Morteza Ziabakhsh", email = "morteza24mail@protonmail.com"},
]
readme = "README.rst"
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
license = "MIT"
license-files = ["LICENSE*"]
dynamic = ["version", "description"]
dependencies = [
  "numpy",
  "scipy",
  "typeguard",
  "myst_parser"
]

[project.optional-dependencies]
deep = [
  "torch",
  "torch_geometric",
]
dev = [
  "matplotlib",
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "scikit-learn",
  "pandas",
  "psutil",
]

[project.urls]
Homepage = "https://soft-clustering.readthedocs.io/en/latest/index.html"
Issues = "https://github.com/soft-clustering/soft-clustering/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["soft_clustering"]
branch = true
omit = ["soft_clustering/test_*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.black]
target-version = ["py310"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
# Pyflakes (F) catches real defects; pycodestyle (E, W) and isort (I) keep the
# tree consistent. Rules that would require reformatting third-party-derived
# algorithm code without improving it are left off.
select = ["E", "F", "W", "I", "UP"]
ignore = [
  "E501",  # line length is enforced by black
  "E741",  # single-letter names are idiomatic in the algorithm implementations
]

[tool.ruff.lint.per-file-ignores]
"soft_clustering/__init__.py" = ["F401"]
"example/*.py" = ["E402"]  # examples adjust sys.path before importing
