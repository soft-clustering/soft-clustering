[build-system]
requires = ["flit_core >=3.12,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "soft-clustering"
authors = [
  {name = "Kiyan Rezaee", email = "kiyanrezaee17@gmail.com"},
  {name = "Morteza Ziabakhsh", email = "morteza24mail@protonmail.com"},
]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
license = "MIT"
license-files = ["LICENSE*"]
dynamic = ["version", "description"]
# Kept to what is needed to fit a model. Anything required only to benchmark,
# document or develop the package belongs in an extra below.
dependencies = [
  "numpy",
  "scipy",
  "typeguard",  # the @typechecked decorator applied by 39 estimators
]

[project.optional-dependencies]
deep = [
  "torch",
  "torch_geometric",
]
# Sphinx and its Markdown parser. Mirrored in docs/requirements.txt, which is
# what Read the Docs installs.
docs = [
  "sphinx",
  "sphinx-rtd-theme",
  "myst_parser",
]
# Needed to *run* a benchmark, never to fit a model. soft_clustering.benchmarking
# imports these defensively, so the module is importable without them.
bench = [
  "scikit-learn",  # dataset loaders and the supervised/hard validity metrics
  "pandas",        # result tables
  "psutil",        # resident-set sampling for the memory and scalability backends
  "tabulate",      # BenchmarkReport.to_markdown()
]
dev = [
  "matplotlib",
  "pytest>=7.0",
  "pytest-cov>=4.0",
  # Kept in step with the bench extra above; listed explicitly rather than via a
  # self-referential extra, which does not resolve reliably for editable installs.
  "scikit-learn",
  "pandas",
  "psutil",
  "tabulate",
]

[project.urls]
Homepage = "https://soft-clustering.readthedocs.io/en/latest/index.html"
Issues = "https://github.com/soft-clustering/soft-clustering/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["soft_clustering"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.black]
target-version = ["py310"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
# Pyflakes (F) catches real defects; pycodestyle (E, W) and isort (I) keep the
# tree consistent. Rules that would require reformatting third-party-derived
# algorithm code without improving it are left off.
select = ["E", "F", "W", "I", "UP"]
ignore = [
  "E501",  # line length is enforced by black
  "E741",  # single-letter names are idiomatic in the algorithm implementations
]

[tool.ruff.lint.per-file-ignores]
"soft_clustering/__init__.py" = ["F401"]
"example/*.py" = ["E402"]  # examples adjust sys.path before importing
