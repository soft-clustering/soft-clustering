# Same tools and versions as .github/workflows/lint.yml, so a commit that
# passes locally passes CI. Install with: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(soft_clustering|tests|example|tools|benchmarks)/
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        files: ^(soft_clustering|tests|example|tools|benchmarks)/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
        exclude: \.(csv|tex|jsonl)$
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: detect-private-key
